# Taking the new image live is a person's act, not a push's. Press this, name
# the tag, and it SSHes to the VPS and runs /docker/pet-meds/deploy.sh <tag>.
# The script lives on the box so a deploy stays runnable over SSH when CI is
# the thing that is broken. Runbook: docs/deploy.md.
name: deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The image tag to deploy: a twelve-character commit, or latest'
        required: true
        default: latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Join the tailnet
        # SSH on the VPS is reachable over Tailscale, and public port 22 is
        # closing. The runner joins as tag:ci for this job only; the tailnet
        # policy lets tag:ci reach tag:vps on tcp:22 and nothing else.
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.VPS_TAILNET_ADDR }}

      - name: The key and the host it is allowed to reach
        # The host key is a repository VARIABLE, not a secret: a public key is
        # public, and pinning it means a recreated box fails the deploy loudly
        # instead of trusting whatever answers.
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
        run: |
          test -n "$VPS_HOST" && test -n "$VPS_HOST_KEY" || { echo "set repo variables VPS_HOST and VPS_HOST_KEY (docs/deploy.md)"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s %s\n' "$VPS_HOST" "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_TAILNET_ADDR: ${{ vars.VPS_TAILNET_ADDR }}
          TAG: ${{ inputs.tag }}
        run: |
          test -n "$VPS_TAILNET_ADDR" || { echo "set repo variable VPS_TAILNET_ADDR (docs/deploy.md)"; exit 1; }
          # Over the tailnet; HostKeyAlias keeps the host key pinned under VPS_HOST.
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o HostKeyAlias="$VPS_HOST" \
            "root@$VPS_TAILNET_ADDR" /docker/pet-meds/deploy.sh "'$TAG'"
